<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2">
        <animate attributeName="stop-color" values="#0A66C2;#2C5364;#0F2027;#0A66C2" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0F2027">
        <animate attributeName="stop-color" values="#0F2027;#0A66C2;#2C5364;#0F2027" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#134e78">
        <animate attributeName="stop-color" values="#134e78;#1c6ea4;#134e78" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1c6ea4">
        <animate attributeName="stop-color" values="#1c6ea4;#134e78;#1c6ea4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- base gradient -->
  <rect width="1200" height="200" fill="url(#bg)" />

  <!-- circuit board traces -->
  <g stroke="#8fd6ff" stroke-width="1.4" fill="none" opacity="0.28">
    <path d="M0,40 H120 L140,60 H260 L280,40 H420">
      <animate attributeName="stroke-dasharray" values="0,900;900,0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M120,40 V15 H180" >
      <animate attributeName="stroke-dasharray" values="0,200;200,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M500,20 H620 L640,40 H760 L780,20 H960 L980,40 H1200">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M780,20 V0">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,90 H80 L100,70 H260 L280,90 H520 L540,70 H700">
      <animate attributeName="stroke-dasharray" values="0,900;900,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M850,90 H950 L970,70 H1200">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing circuit nodes -->
  <g fill="#8fd6ff">
    <circle cx="140" cy="60" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="40" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="40" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="20" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="40" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="70" r="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="70" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="70" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating code symbols -->
  <g fill="#ffffff" font-family="Fira Code, Consolas, monospace" font-weight="600" opacity="0.16">
    <text x="60" y="140" font-size="26">&lt;/&gt;</text>
    <text x="200" y="170" font-size="20">{ }</text>
    <text x="340" y="130" font-size="18">01</text>
    <text x="470" y="165" font-size="22">&lt;/&gt;</text>
    <text x="620" y="135" font-size="16">;</text>
    <text x="720" y="175" font-size="20">{ }</text>
    <text x="860" y="130" font-size="24">&lt;/&gt;</text>
    <text x="980" y="168" font-size="18">10</text>
    <text x="1100" y="135" font-size="22">{ }</text>

    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-6; 0,0" dur="5s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- wave transitions -->
  <path fill="url(#waveBack)" opacity="0.5">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,140 C 200,165 400,120 600,135 C 800,150 1000,110 1200,135 L1200,200 L0,200 Z;
        M0,135 C 200,115 400,160 600,140 C 800,120 1000,155 1200,125 L1200,200 L0,200 Z;
        M0,140 C 200,165 400,120 600,135 C 800,150 1000,110 1200,135 L1200,200 L0,200 Z" />
  </path>

  <path fill="#0d1117">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,165 C 200,190 400,155 600,168 C 800,180 1000,150 1200,168 L1200,200 L0,200 Z;
        M0,168 C 200,150 400,185 600,163 C 800,140 1000,178 1200,155 L1200,200 L0,200 Z;
        M0,165 C 200,190 400,155 600,168 C 800,180 1000,150 1200,168 L1200,200 L0,200 Z" />
  </path>
</svg>
