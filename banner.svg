<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2027">
        <animate attributeName="stop-color"
          values="#0F2027;#2C5364;#0A66C2;#2C5364;#0F2027"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#2C5364">
        <animate attributeName="stop-color"
          values="#2C5364;#0A66C2;#2C5364;#0F2027;#2C5364"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A66C2">
        <animate attributeName="stop-color"
          values="#0A66C2;#2C5364;#0F2027;#2C5364;#0A66C2"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; 40 0; 0 0" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <rect width="1200" height="160" fill="url(#bannerGrad)" />

  <path d="M0,160 C 200,190 400,130 600,155 C 800,180 1000,140 1200,160 L1200,200 L0,200 Z"
        fill="#0d1117" />
</svg>
