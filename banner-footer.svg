<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027">
        <animate attributeName="stop-color" values="#0F2027;#0A66C2;#2C5364;#0F2027" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0A66C2">
        <animate attributeName="stop-color" values="#0A66C2;#2C5364;#0F2027;#0A66C2" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveBackF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c6ea4">
        <animate attributeName="stop-color" values="#1c6ea4;#134e78;#1c6ea4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#134e78">
        <animate attributeName="stop-color" values="#134e78;#1c6ea4;#134e78" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- top wave transitions (mirrored from header, now leading in) -->
  <path fill="#0d1117">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,0 L1200,0 L1200,35 C 1000,53 800,20 600,32 C 400,45 200,10 0,35 Z;
        M0,0 L1200,0 L1200,32 C 1000,10 800,45 600,35 C 400,20 200,53 0,25 Z;
        M0,0 L1200,0 L1200,35 C 1000,53 800,20 600,32 C 400,45 200,10 0,35 Z" />
  </path>

  <path fill="url(#waveBackF)" opacity="0.5">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,20 L1200,20 L1200,60 C 1000,45 800,65 600,50 C 400,35 200,60 0,45 Z;
        M0,20 L1200,20 L1200,50 C 1000,65 800,40 600,55 C 400,70 200,45 0,60 Z;
        M0,20 L1200,20 L1200,60 C 1000,45 800,65 600,50 C 400,35 200,60 0,45 Z" />
  </path>

  <!-- base gradient block -->
  <rect y="60" width="1200" height="60" fill="url(#bgf)" />

  <!-- circuit board traces -->
  <g stroke="#8fd6ff" stroke-width="1.4" fill="none" opacity="0.28">
    <path d="M0,90 H120 L140,105 H260 L280,90 H420">
      <animate attributeName="stroke-dasharray" values="0,900;900,0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M500,80 H620 L640,95 H760 L780,80 H960 L980,95 H1200">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,105 H80 L100,115 H260 L280,105 H520">
      <animate attributeName="stroke-dasharray" values="0,700;700,0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M850,105 H950 L970,115 H1200">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pulsing nodes -->
  <g fill="#8fd6ff">
    <circle cx="140" cy="105" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="90" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="95" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="80" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="95" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating code symbols -->
  <g fill="#ffffff" font-family="Fira Code, Consolas, monospace" font-weight="600" opacity="0.16">
    <text x="80" y="75" font-size="20">{ }</text>
    <text x="260" y="100" font-size="16">01</text>
    <text x="470" y="78" font-size="22">&lt;/&gt;</text>
    <text x="700" y="102" font-size="18">;</text>
    <text x="900" y="76" font-size="20">{ }</text>
    <text x="1080" y="100" font-size="22">&lt;/&gt;</text>

    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="5s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
